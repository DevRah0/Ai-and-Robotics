name: GeoLab Personal • iOS build

on:
  push:
    branches: [main, geolab-personal-2026]
    paths:
      - 'projects/GeoLabPersonal/**'
      - 'projects/GeoLabPersonal/**'
      - 'projects/GeoLabPersonal/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'projects/GeoLabPersonal/**'
      - 'projects/GeoLabPersonal/**'
      - 'projects/GeoLabPersonal/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    defaults:
      run:
        working-directory: projects/GeoLabPersonal
    steps:
      - uses: actions/checkout@v4
      - name: Project static tests
        run: python3 -m unittest discover -s Tests -v
      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -list -project GeoLab.xcodeproj
      - name: Compile iOS Simulator (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project GeoLab.xcodeproj -scheme GeoLab -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/geolab-simulator" \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/simulator-build.log"
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/geolab-simulator/Build/Products/Debug-iphonesimulator/GeoLab.app" \
            GeoLab-Simulator.zip
      - name: Compile iOS device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project GeoLab.xcodeproj -scheme GeoLab -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/geolab-device" \
            CODE_SIGNING_ALLOWED=NO build | tee "$RUNNER_TEMP/device-build.log"
      - name: Package unsigned IPA (NOT INSTALLABLE)
        run: |
          mkdir -p "$RUNNER_TEMP/geolab-payload/Payload"
          cp -R "$RUNNER_TEMP/geolab-device/Build/Products/Release-iphoneos/GeoLab.app" \
            "$RUNNER_TEMP/geolab-payload/Payload/GeoLab.app"
          (cd "$RUNNER_TEMP/geolab-payload" && zip -qry "$GITHUB_WORKSPACE/projects/GeoLabPersonal/GeoLab-UNSIGNED.ipa" Payload)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GeoLab-build-logs
          path: ${{ runner.temp }}/*-build.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: GeoLab-Simulator-App
          path: projects/GeoLabPersonal/GeoLab-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GeoLab-Unsigned-iOS-IPA
          path: projects/GeoLabPersonal/GeoLab-UNSIGNED.ipa
